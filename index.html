 const nav=[["about","about"],["skills","skills"],["projects","projects"]];
 if(C.certs.length)nav.push(["certs","certs"]);nav.push(["contact","contact"]);
 $("#links").innerHTML=`<a class="l" href="#home">${t.home}</a>`+nav.map(([id,k])=>`<a class="l" href="#${id}">${t[k]}</a>`).join("")+`<a class="btn pri cta-nav" href="#contact" style="padding:8px 18px;margin-inline-start:8px">${t.hire}</a>`;
 $("#avail").innerHTML=C.available?`<span class="dot"></span>${t.avail}`:"";$("#avail").style.display=C.available?"inline-flex":"none";
 $("#name").textContent=pick(C.name);$("#intro").textContent=pick(C.bio);
 $("#heroBtns").innerHTML=`<a class="btn pri" href="#projects">${t.view}</a>`+(C.cv?`<a class="btn" href="${esc(C.cv)}" download>${t.cv}</a>`:"")+`<a class="btn" href="#contact">${t.hire}</a>`;
 $("#soc").innerHTML=socials();
 $("#photo").innerHTML=C.photo?`<img src="${esc(C.photo)}" alt="${esc(pick(C.name))}" width="480" height="600" fetchpriority="high">`:`<div class="ph"><b>${C.initials}</b>Profile photo placeholder<br>(set CONFIG.photo)</div>`;
 const img=$("#photo img");if(img)img.onerror=()=>{$("#photo").innerHTML=`<div class="ph"><b>${C.initials}</b>Photo not found</div>`};
 // about
 $("#aboutBox").innerHTML=`<div class="rv"><div class="eyebrow">${t.ab_s}</div><h2>${t.ab_t}</h2></div>
  <div class="agrid rv" style="margin-top:24px"><div>${pick(C.about).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  <div class="facts"><div class="fact"><small>${t.loc}</small>${esc(pick(C.location))}</div><div class="fact"><small>${t.foc}</small>${t.focv}</div><div class="fact"><small>${t.st}</small>${t.stv}</div></div></div>`;
 // skills
 $("#skillsBox").innerHTML=`<div class="rv"><div class="eyebrow">${t.sk_s}</div><h2>${t.sk_t}</h2><p class="sub">${t.sk_d}</p></div>
  <div class="sgrid rv">${C.skills.map(g=>`<div class="sk"><h3>${esc(pick(g.t))}</h3><div class="chips">${(Array.isArray(g.items)?g.items:pick(g.items)).map(i=>`<span class="chip ${g.main?"main":""}">${esc(i)}</span>`).join("")}</div></div>`).join("")}</div>`;
 // projects
 const cats=["all",...new Set(C.projects.map(p=>p.cat))];
 const cn={all:t.all,python:"Python",sql:"SQL",powerbi:"Power BI",excel:"Excel"};
 const list=C.projects.filter(p=>flt==="all"||p.cat===flt);
 $("#projBox").innerHTML=`<div class="rv"><div class="eyebrow">${t.pr_s}</div><h2>${t.pr_t}</h2><p class="sub">${t.pr_d}</p></div>
  <div class="filters" role="group" aria-label="Filter">${cats.map(c=>`<button data-c="${c}" aria-pressed="${c===flt}">${cn[c]||c}</button>`).join("")}</div>
  <div class="pgrid">${list.map(p=>`<article class="pc rv"><div class="cover" aria-hidden="true">${p.icon}</div><div class="pb">
   <div><span class="tag">${cn[p.cat]||p.cat}</span>${p.sample?`<span class="samp">${t.samp}</span>`:""}</div>
   <h3>${esc(pick(p.title))}</h3><p>${esc(pick(p.desc))}</p><div class="chips">${p.tools.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
   <button class="btn" data-p="${p.id}">${t.det}</button></div></article>`).join("")}</div>`;
 // certs
 const cs=$("#certs");cs.style.display=C.certs.length?"":"none";
 $("#certBox").innerHTML=C.certs.length?`<div class="rv"><div class="eyebrow">${t.ce_s}</div><h2>${t.ce_t}</h2></div><div class="cgrid rv" style="margin-top:24px">${C.certs.map(c=>`<div class="cert"><h3 style="font-size:1rem">${esc(pick(c.title))}</h3><small>${esc(c.issuer||"")} ${esc(c.date||"")}</small>${c.url?`<br><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac)">↗</a>`:""}</div>`).join("")}</div>`:"";
 // contact
 $("#contactBox").innerHTML=`<div class="rv"><div class="eyebrow">${t.co_s}</div><h2>${t.co_t}</h2><p class="sub">${t.co_d}</p></div>
  <div class="cgrid2 rv"><div><div class="cl">
   <div class="row"><a href="${mail}">${esc(C.email)}</a><button class="btn" id="cp" style="padding:6px 14px;font-size:.8rem">${t.copy}</button></div>
   <div class="row"><a href="${tel}" dir="ltr">${esc(C.phone)}</a></div>
   <div class="row">${esc(pick(C.location))}</div></div><div class="soc">${socials()}</div></div>
  <form id="f" novalidate><div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
   ${[["n","text","name"],["e","email","email"],["s","text","subject"]].map(([k,ty,id])=>`<div><label for="${id}">${t[k]}</label><input id="${id}" type="${ty}" aria-describedby="${id}E"><div class="err" id="${id}E" role="alert"></div></div>`).join("")}
   <div><label for="message">${t.m}</label><textarea id="message" rows="5" aria-describedby="messageE"></textarea><div class="err" id="messageE" role="alert"></div></div>
   <button class="btn pri" type="submit" id="sb">${t.send}</button><div id="st" role="status" aria-live="polite"></div></form></div>`;
 $("#copy").textContent=`© ${new Date().getFullYear()} ${pick(C.name)}. ${t.rights}`;
 $("#top").textContent="↑ "+t.top;
 bind();reveal();spy();roles();
}
function roles(){
 clearInterval(rTimer);const r=pick(C.roles),el=$("#role");rIdx=0;el.textContent=r[0];
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 rTimer=setInterval(()=>{el.classList.add("f");setTimeout(()=>{rIdx=(rIdx+1)%r.length;el.textContent=r[rIdx];el.classList.remove("f")},350)},2600);
}
function reveal(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
 document.querySelectorAll(".rv").forEach(n=>io.observe(n));
}
let spyIO;
function spy(){
 if(spyIO)spyIO.disconnect();
 spyIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll(".links a.l").forEach(a=>a.classList.toggle("act",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
 document.querySelectorAll("section[id]").forEach(s=>spyIO.observe(s));
}
function bind(){
 document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{flt=b.dataset.c;render();location.hash="#projects"});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>openP(b.dataset.p));
 document.querySelectorAll(".links a").forEach(a=>a.onclick=()=>closeMenu());
 $("#cp").onclick=async e=>{try{await navigator.clipboard.writeText(C.email);e.target.textContent=T[lang].copied;setTimeout(()=>e.target.textContent=T[lang].copy,1600)}catch(x){location.href=mail}};
 $("#f").onsubmit=submit;
}
function openP(id){
 const p=C.projects.find(x=>x.id===id),t=T[lang],d=$("#dlg");
 const lk=(u,l)=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${l}</a>`:`<span class="btn" aria-disabled="true">${l}: ${t.none}</span>`;
 d.innerHTML=`<h3>${esc(pick(p.title))}${p.sample?`<span class="samp">${t.samp}</span>`:""}</h3><p>${esc(pick(p.desc))}</p>
  <p><b>${t.tools}:</b> ${p.tools.join(", ")}</p><p><b>${t.role}:</b> ${esc(pick(p.role))}</p><p><b>${t.ch}:</b> ${esc(pick(p.ch))}</p><p><b>${t.sol}:</b> ${esc(pick(p.sol))}</p>
  <div class="btns" style="margin-top:16px">${lk(p.live,"Live")}${lk(p.code,"Code")}<button class="btn pri" id="cl">${t.close}</button></div>`;
 d.showModal();$("#cl").onclick=()=>d.close();
}
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
function submit(e){
 e.preventDefault();const t=T[lang];let ok=true;
 const v={name:$("#name").value||"",};
 const f={name:$("#f #name"),email:$("#f #email"),subject:$("#f #subject"),message:$("#f #message")};
 Object.entries(f).forEach(([k,el])=>{
  const val=el.value.trim(),er=$("#"+k+"E");let m="";
  if(!val)m=t.r;else if(k==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))m=t.ie;
  er.textContent=m;el.setAttribute("aria-invalid",!!m);if(m)ok=false;
 });
 if(!ok||e.target.website.value)return;
 $("#st").textContent=t.ok;
 const body=`${f.message.value}\n\n— ${f.name.value} (${f.email.value})`;
 location.href=`${mail}?subject=${encodeURIComponent(f.subject.value)}&body=${encodeURIComponent(body)}`;
}
function closeMenu(){$("#links").classList.remove("open");$("#burger").setAttribute("aria-expanded","false")}
$("#burger").onclick=()=>{const o=$("#links").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
$("#lang").onclick=()=>{lang=lang==="en"?"ar":"en";store.set("lang",lang);render()};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";store.set("theme",theme);applyMode()};
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
render();
</script>
</body>
</html>
